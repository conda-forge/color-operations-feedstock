{% set name = "color-operations" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 456b21e5784c7c9ee2ddf3c6041e66a501f173d286e3e088779cf716fd1b321d

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
  host:
    - python
    - numpy
    - cython
    - pip
    - setuptools
  run:
    - python
    - numpy

test:
  imports:
    - color_operations
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/vincentsarago/color-operations
  summary: Apply basic color-oriented image operations.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - giswqs
    - jsignell
